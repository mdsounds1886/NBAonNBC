<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA on NBC Tools</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
    }

    body {
        display: flex;
        flex-direction: column;
    }

    header {
        height: 64px;
        flex-shrink: 0;

        display: flex;
        align-items: center;
        gap: 12px;

        padding: 0 22px;

        background: #3F2A51;
        border-bottom: 2px solid #86588E;
    }

    .brand {
        color: #FFFFEB;
        font-size: 18px;
        font-weight: 700;
        margin-right: 24px;
        white-space: nowrap;
    }

    button {
        border: 1px solid #897A93;
        border-radius: 8px;
        background: rgba(255,255,255,.08);
        color: #FFFFEB;

        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;

        cursor: pointer;
    }

    button:hover {
        background: #86588E;
    }

    button.active {
        background: #C7DDCA;
        color: #3F2A51;
        border-color: #C7DDCA;
    }

    iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: #fff;
    }

    #home {
        flex: 1;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
            radial-gradient(circle at center, #3F2A51 0%, #17121b 65%);

        color: #FFFFEB;
    }

    .home-card {
        text-align: center;
    }

    .home-card h1 {
        margin-bottom: 8px;
        font-size: 38px;
    }

    .home-card p {
        color: #C7DDCA;
        font-size: 17px;
    }
</style>
</head>

<body>

<header>

    <div class="brand">
        NBA ON NBC TOOLS
    </div>

    <button id="homeBtn"
            class="active"
            onclick="showHome()">
        Home
    </button>

    <button id="routeBtn"
            onclick="loadTool('route-tracer.html', 'routeBtn')">
        Route Tracer
    </button>

    <button id="mapBtn"
            onclick="loadTool('bus-main-mapping.html', 'mapBtn')">
        Bus & Main Mapping
    </button>

</header>


<div id="home">
    <div class="home-card">
        <h1>NBA on NBC</h1>
        <p>Select a tool above.</p>
    </div>
</div>


<iframe
    id="toolFrame"
    style="display:none;">
</iframe>


<script>

const frame = document.getElementById('toolFrame');
const home = document.getElementById('home');

function clearButtons() {
    document.querySelectorAll('header button')
        .forEach(button => button.classList.remove('active'));
}

function showHome() {

    clearButtons();

    document.getElementById('homeBtn')
        .classList.add('active');

    frame.style.display = 'none';
    home.style.display = 'flex';
}


function loadTool(file, buttonID) {

    clearButtons();

    document.getElementById(buttonID)
        .classList.add('active');

    home.style.display = 'none';

    frame.src = file;
    frame.style.display = 'block';
}

</script>

</body>
</html>
